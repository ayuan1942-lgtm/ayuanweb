<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>口算计时练习【手机版】</title>
<style>
*{margin:0;padding:0;font-family:system-ui, sans-serif;box-sizing:border-box}
body{padding:20px;text-align:center;background:#f7f7f7}
h1{font-size:26px;margin:15px 0}
.screen{display:none}
.screen.active{display:block}
.question{font-size:46px;margin:30px 0;font-weight:bold}
#progress{font-size:20px;color:#666;margin-top:10px}
#time{font-size:28px;color:#228822;margin:20px 0}
#inputBox{font-size:32px;padding:12px;width:220px;text-align:center}
#tip{margin-top:20px;font-size:22px;color:#333;min-height:30px}
#keyboard{margin-top:30px}
#keyboard button{
    width:75px;height:75px;
    font-size:28px;margin:4px;
    border:none;border-radius:8px;background:#fff;box-shadow:0 2px 4px #0002
}
.mainBtn{
    padding:15px 30px;font-size:22px;margin:10px;border:none;border-radius:8px;background:#348ede;color:#fff
}
.summary{font-size:24px;margin:15px 0;color:#333}
.summary b{color:#228822;font-size:30px}
#resultList{text-align:left;margin-top:20px}
.row{
    display:flex;align-items:center;
    background:#fff;border-radius:8px;
    padding:10px 12px;margin-bottom:8px;
    font-size:18px;box-shadow:0 1px 3px #0001
}
.row .idx{width:34px;color:#999}
.row .expr{flex:1;font-weight:bold}
.row .ans{width:80px;color:#555}
.row .cost{width:86px;text-align:right;color:#348ede}
.row.ok .expr{color:#228822}
.row.bad .expr{color:#d33}
</style>
</head>
<body>
<h1>口算计时练习</h1>

<!-- 开始页 -->
<div id="startScreen" class="screen active">
  <div class="question">共 10 道题</div>
  <button class="mainBtn" onclick="startGame()">开始答题</button>
</div>

<!-- 答题页 -->
<div id="quizScreen" class="screen">
  <div id="progress">第 1 / 10 题</div>
  <div id="question2" class="question">准备开始</div>
  <div id="time">总用时：0.00 秒</div>
  <input id="inputBox" placeholder="答案" readonly>
  <div id="tip"></div>
  <div id="keyboard">
    <button onclick="addNum(1)">1</button>
    <button onclick="addNum(2)">2</button>
    <button onclick="addNum(3)">3</button>
    <button onclick="del()">←</button>
    <br>
    <button onclick="addNum(4)">4</button>
    <button onclick="addNum(5)">5</button>
    <button onclick="addNum(6)">6</button>
    <button onclick="clearAll()">C</button>
    <br>
    <button onclick="addNum(7)">7</button>
    <button onclick="addNum(8)">8</button>
    <button onclick="addNum(9)">9</button>
    <button onclick="submit()">✓</button>
    <br>
    <button onclick="addNum(0)">0</button>
  </div>
</div>

<!-- 结算页 -->
<div id="resultScreen" class="screen">
  <div id="question3" class="question">答题完成</div>
  <div class="summary">总用时：<b id="totalTime">0.00</b> 秒</div>
  <div class="summary">正确：<b id="correctCount">0</b> / 10</div>
  <div id="resultList"></div>
  <button class="mainBtn" onclick="startGame()">再来一轮</button>
</div>

<script>
const TOTAL = 10;
const inputBox = document.getElementById("inputBox");
const timeDom = document.getElementById("time");

let questions = [];   // {a, b, answer, user, cost, right}
let current = 0;
let totalStart = 0;
let questionStart = 0;
let timer = null;
let locked = false;

// 生成 0 ~ 100 之间数字
function randomNum(){
    return Math.floor(Math.random() * 101);
}

function showScreen(id){
    document.querySelectorAll(".screen").forEach(el => el.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

function startGame(){
    questions = [];
    for(let i = 0; i < TOTAL; i++){
        const a = randomNum();
        const b = randomNum();
        questions.push({ a, b, answer: a + b, user: null, cost: 0, right: false });
    }
    current = 0;
    totalStart = Date.now();
    locked = false;
    showScreen("quizScreen");
    renderQuestion();
    if(timer) clearInterval(timer);
    timer = setInterval(updateTime, 50);
}

function renderQuestion(){
    const q = questions[current];
    document.getElementById("progress").innerText = `第 ${current + 1} / ${TOTAL} 题`;
    document.getElementById("question2").innerText = `${q.a} + ${q.b} = ?`;
    document.getElementById("tip").innerText = "";
    inputBox.value = "";
    questionStart = Date.now();
}

function updateTime(){
    const cost = ((Date.now() - totalStart) / 1000).toFixed(2);
    timeDom.innerText = `总用时：${cost} 秒`;
}

function addNum(n){
    if(locked) return;
    if(inputBox.value.length >= 5) return;
    inputBox.value += n;
}

function del(){
    if(locked) return;
    inputBox.value = inputBox.value.slice(0, -1);
}

function clearAll(){
    if(locked) return;
    inputBox.value = "";
}

function submit(){
    if(locked) return;
    if(inputBox.value === ""){
        document.getElementById("tip").innerText = "请先输入答案";
        return;
    }
    locked = true;
    const q = questions[current];
    q.user = Number(inputBox.value);
    q.cost = (Date.now() - questionStart) / 1000;
    q.right = q.user === q.answer;
    document.getElementById("tip").innerText = q.right
        ? `✅ 正确！本题 ${q.cost.toFixed(2)} 秒`
        : `❌ 错误，正确答案：${q.answer}`;

    setTimeout(() => {
        current++;
        if(current < TOTAL){
            locked = false;
            renderQuestion();
        }else{
            finishGame();
        }
    }, 600);
}

function finishGame(){
    if(timer) clearInterval(timer);
    timer = null;
    const totalCost = ((Date.now() - totalStart) / 1000).toFixed(2);
    const rightNum = questions.filter(q => q.right).length;

    document.getElementById("totalTime").innerText = totalCost;
    document.getElementById("correctCount").innerText = rightNum;

    const list = document.getElementById("resultList");
    list.innerHTML = questions.map((q, i) => `
        <div class="row ${q.right ? "ok" : "bad"}">
            <span class="idx">${i + 1}.</span>
            <span class="expr">${q.a} + ${q.b} = ${q.answer}</span>
            <span class="ans">${q.right ? "✅" : "❌ " + q.user}</span>
            <span class="cost">${q.cost.toFixed(2)}s</span>
        </div>
    `).join("");

    showScreen("resultScreen");
}
</script>
</body>
</html>
