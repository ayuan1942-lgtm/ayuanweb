<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>定位记录</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      background: #f5f7fa;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
      background: #fff;
      border-bottom: 1px solid #eef0f4;
    }

    .pin {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4f7cff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
    }

    .app-title {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #1f2937;
    }

    .action-btn {
      flex-shrink: 0;
      margin-left: auto;
      height: 32px;
      padding: 0 14px;
      border: none;
      border-radius: 16px;
      background: #4f7cff;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .action-btn:active {
      opacity: 0.8;
    }

    .action-btn:disabled {
      background: #a9bcf5;
      cursor: default;
    }

    .content {
      flex: 1;
      padding: 16px;
    }

    .hint {
      margin: 0 0 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: #fdecec;
      color: #d14343;
      font-size: 13px;
      line-height: 1.5;
    }

    .empty {
      padding: 48px 0;
      text-align: center;
      font-size: 13px;
      color: #b3b9c2;
    }

    .list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .record {
      padding: 14px 16px;
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 2px 10px rgba(31, 41, 55, 0.05);
    }

    .record-top {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .remove-btn {
      flex-shrink: 0;
      margin-left: auto;
      padding: 0;
      border: none;
      background: none;
      color: #c3c9d2;
      font-size: 12px;
      cursor: pointer;
      transition: color 0.15s;
    }

    .remove-btn:hover,
    .remove-btn:active {
      color: #d14343;
    }

    .coord {
      display: flex;
      flex: 1;
      min-width: 0;
      flex-direction: column;
      gap: 2px;
    }

    .coord-label {
      font-size: 11px;
      letter-spacing: 1px;
      color: #9aa1ab;
    }

    .coord-value {
      font-size: 15px;
      font-weight: 600;
      color: #1f2937;
      font-variant-numeric: tabular-nums;
    }

    .record-meta {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px dashed #eceef2;
      font-size: 11px;
      color: #b3b9c2;
      font-variant-numeric: tabular-nums;
    }

    /* 平板 / 桌面：居中卡片 */
    @media (min-width: 640px) {
      .page {
        align-items: center;
        padding: 32px 16px;
        background: radial-gradient(circle at 50% 0%, #eef2ff 0%, #f5f7fa 60%, #f5f7fa 100%);
      }

      .app-bar,
      .content {
        width: 100%;
        max-width: 400px;
      }

      .app-bar {
        border-radius: 18px 18px 0 0;
        border: 1px solid #eef0f4;
        border-bottom: none;
        padding: 18px 20px;
      }

      .content {
        flex: 0 1 auto;
        background: #fff;
        border: 1px solid #eef0f4;
        border-top: none;
        border-radius: 0 0 18px 18px;
        padding: 16px 20px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-bar">
      <div class="pin" aria-hidden="true"></div>
      <span class="app-title">定位记录</span>
      <button id="locate-btn" class="action-btn">获取定位</button>
    </header>

    <main class="content">
      <p id="hint" class="hint" hidden></p>
      <div id="empty" class="empty">暂无记录，点击右上角获取定位</div>
      <div id="list" class="list"></div>
    </main>
  </div>

  <script>
    const STORAGE_KEY = 'location-records'

    const listEl = document.getElementById('list')
    const emptyEl = document.getElementById('empty')
    const hintEl = document.getElementById('hint')
    const btn = document.getElementById('locate-btn')

    const loadRecords = () => {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]')
        return Array.isArray(data) ? data : []
      } catch {
        return []
      }
    }

    const records = loadRecords()

    const saveRecords = () => {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(records))
    }

    const pad = (n) => String(n).padStart(2, '0')

    const formatTime = (ts) => {
      const d = new Date(ts)
      return (
        d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
        ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
      )
    }

    const el = (tag, className, text) => {
      const node = document.createElement(tag)
      if (className) node.className = className
      if (text !== undefined) node.textContent = text
      return node
    }

    const buildRecord = (record, index) => {
      const item = el('div', 'record')
      const top = el('div', 'record-top')

      const lngBox = el('div', 'coord')
      lngBox.append(
        el('span', 'coord-label', '经度'),
        el('span', 'coord-value', record.lng.toFixed(6)),
      )

      const latBox = el('div', 'coord')
      latBox.append(
        el('span', 'coord-label', '纬度'),
        el('span', 'coord-value', record.lat.toFixed(6)),
      )

      const removeBtn = el('button', 'remove-btn', '删除')
      removeBtn.type = 'button'
      removeBtn.addEventListener('click', () => removeRecord(index))

      top.append(lngBox, latBox, removeBtn)

      const meta = el('div', 'record-meta')
      meta.append(
        el('span', '', '精度约 ' + Math.round(record.accuracy) + ' 米'),
        el('span', '', formatTime(record.time)),
      )

      item.append(top, meta)
      return item
    }

    const removeRecord = (index) => {
      records.splice(index, 1)
      saveRecords()
      render()
    }

    const render = () => {
      listEl.textContent = ''
      emptyEl.hidden = records.length > 0
      records.forEach((record, index) => listEl.append(buildRecord(record, index)))
    }

    const showHint = (message) => {
      hintEl.textContent = message
      hintEl.hidden = false
    }

    const locate = () => {
      hintEl.hidden = true

      if (!('geolocation' in navigator)) {
        showHint('当前浏览器不支持定位功能')
        return
      }

      btn.disabled = true
      btn.textContent = '定位中…'

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          records.unshift({
            lng: pos.coords.longitude,
            lat: pos.coords.latitude,
            accuracy: pos.coords.accuracy,
            time: Date.now(),
          })
          saveRecords()
          render()
          btn.disabled = false
          btn.textContent = '获取定位'
        },
        (err) => {
          showHint(err.message || '定位失败')
          btn.disabled = false
          btn.textContent = '获取定位'
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
      )
    }

    btn.addEventListener('click', locate)
    render()
  </script>
</body>
</html>
