<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>当前位置</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    .page {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      background: #f5f7fa;
      font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    .app-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: calc(env(safe-area-inset-top) + 14px) 16px 14px;
      background: #fff;
      border-bottom: 1px solid #eef0f4;
    }

    .pin {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #4f7cff;
      box-shadow: 0 0 0 3px rgba(79, 124, 255, 0.15);
    }

    .app-title {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #1f2937;
    }

    .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px 16px;
    }

    .state {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 32px 0;
      font-size: 14px;
      color: #6b7280;
      text-align: center;
    }

    .state.error {
      color: #d14343;
      line-height: 1.6;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #dfe4ea;
      border-top-color: #4f7cff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .coords {
      padding: 18px 20px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 6px 20px rgba(31, 41, 55, 0.06);
    }

    .coord-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 14px 0;
      border-bottom: 1px dashed #eceef2;
    }

    .coord-row:last-of-type {
      border-bottom: none;
    }

    .coord-label {
      font-size: 13px;
      color: #9aa1ab;
      letter-spacing: 1px;
    }

    .coord-value {
      font-size: 22px;
      font-weight: 600;
      color: #1f2937;
      font-variant-numeric: tabular-nums;
    }

    .coord-meta {
      padding-top: 12px;
      font-size: 12px;
      color: #b3b9c2;
    }

    .footer {
      padding: 12px 16px calc(env(safe-area-inset-bottom) + 16px);
    }

    .action-btn {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 12px;
      background: #4f7cff;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    .action-btn:active {
      opacity: 0.8;
    }

    .action-btn:disabled {
      background: #a9bcf5;
      cursor: default;
    }

    .hidden {
      display: none;
    }

    /* 平板 / 桌面：居中卡片 */
    @media (min-width: 640px) {
      .page {
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        background: radial-gradient(circle at 50% 0%, #eef2ff 0%, #f5f7fa 60%, #f5f7fa 100%);
      }

      .app-bar,
      .content,
      .footer {
        width: 100%;
        max-width: 400px;
      }

      .app-bar {
        border-radius: 18px 18px 0 0;
        border: 1px solid #eef0f4;
        border-bottom: none;
        padding: 18px 20px;
      }

      .content {
        background: #fff;
        border-left: 1px solid #eef0f4;
        border-right: 1px solid #eef0f4;
        padding: 24px 20px;
      }

      .coords {
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .footer {
        background: #fff;
        border: 1px solid #eef0f4;
        border-top: none;
        border-radius: 0 0 18px 18px;
        padding: 0 20px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="app-bar">
      <div class="pin" aria-hidden="true"></div>
      <span class="app-title">当前位置</span>
    </header>

    <main class="content">
      <div id="state-loading" class="state">
        <span class="spinner"></span>
        <span>正在获取定位…</span>
      </div>

      <div id="state-error" class="state error hidden">
        <span id="error-text"></span>
      </div>

      <div id="coords" class="coords hidden">
        <div class="coord-row">
          <span class="coord-label">经度</span>
          <span id="longitude" class="coord-value">-</span>
        </div>
        <div class="coord-row">
          <span class="coord-label">纬度</span>
          <span id="latitude" class="coord-value">-</span>
        </div>
        <div id="accuracy" class="coord-meta"></div>
      </div>
    </main>

    <footer class="footer">
      <button id="locate-btn" class="action-btn">重新定位</button>
    </footer>
  </div>

  <script>
    const loadingEl = document.getElementById('state-loading')
    const errorEl = document.getElementById('state-error')
    const errorTextEl = document.getElementById('error-text')
    const coordsEl = document.getElementById('coords')
    const longitudeEl = document.getElementById('longitude')
    const latitudeEl = document.getElementById('latitude')
    const accuracyEl = document.getElementById('accuracy')
    const btn = document.getElementById('locate-btn')

    const format = (num) => num.toFixed(6)

    const showState = (state) => {
      loadingEl.classList.toggle('hidden', state !== 'loading')
      errorEl.classList.toggle('hidden', state !== 'error')
      coordsEl.classList.toggle('hidden', state !== 'success')
      btn.disabled = state === 'loading'
    }

    const locate = () => {
      if (!('geolocation' in navigator)) {
        errorTextEl.textContent = '当前浏览器不支持定位功能'
        showState('error')
        return
      }

      showState('loading')
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          longitudeEl.textContent = format(pos.coords.longitude)
          latitudeEl.textContent = format(pos.coords.latitude)
          accuracyEl.textContent = '精度约 ' + Math.round(pos.coords.accuracy) + ' 米'
          showState('success')
        },
        (err) => {
          errorTextEl.textContent = err.message || '定位失败'
          showState('error')
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 },
      )
    }

    btn.addEventListener('click', locate)
    locate()
  </script>
</body>
</html>
