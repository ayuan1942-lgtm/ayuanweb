<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>数字猜猜猜【手机版】</title>
<style>
*{margin:0;padding:0;font-family:system-ui, sans-serif;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:#f7f7f7;text-align:center;
  display:flex;flex-direction:column;
  padding:16px 16px 300px;
  touch-action:manipulation;user-select:none;
}
h1{font-size:22px;font-weight:600;color:#333;margin-top:6px}
#status{margin-top:12px;font-size:16px;color:#666}
#status b{color:#348ede;font-size:20px}

/* 四个输入框 */
#boxes{display:flex;justify-content:center;gap:12px;margin:28px 0 8px}
.box{
  width:64px;height:80px;line-height:80px;
  background:#fff;border-radius:12px;
  font-size:38px;font-weight:bold;color:#222;
  box-shadow:0 2px 6px #0001;
  border:2px solid transparent;
}
.box.filled{border-color:#348ede}
.box.active{border-color:#348ede;box-shadow:0 0 0 3px #348ede33}

#tip{margin-top:16px;font-size:24px;font-weight:bold;min-height:36px;color:#333}
#tip.good{color:#228822}
#tip.bad{color:#d33}
#answer{margin-top:6px;font-size:16px;color:#888;min-height:22px}

#nextBtn{
  display:none;margin:14px auto 0;
  padding:12px 40px;font-size:20px;border:none;border-radius:10px;
  background:#348ede;color:#fff;
}
#nextBtn.show{display:inline-block}

/* 软键盘 */
#keyboard{
  position:fixed;left:0;right:0;bottom:0;
  background:#e9e9e9;padding:10px 10px 18px;
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  box-shadow:0 -2px 8px #0001;
}
#keyboard button{
  height:60px;font-size:26px;font-weight:600;
  border:none;border-radius:10px;background:#fff;color:#222;
  box-shadow:0 2px 3px #0002;
}
#keyboard button:active{background:#d7d7d7}
#keyboard button.del{background:#dcdcdc;font-size:24px}
#keyboard button:disabled{opacity:.35}
</style>
</head>
<body>
<h1>数字猜猜猜</h1>
<div id="status">第 <b id="round">1</b> 题　尝试 <b id="attempts">1</b> 次　全对 <b id="score">0</b> 题</div>

<div id="boxes">
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
  <div class="box"></div>
</div>

<div id="tip"></div>
<div id="answer"></div>
<button id="nextBtn" onclick="handleNext()">下一题</button>

<div id="keyboard"></div>

<script>
  var LENGTH = 4;
  var target = [];
  var input = [];
  var judged = false;
  var round = 1;
  var attempts = 1;
  var score = 0;

  var boxes = document.querySelectorAll('.box');
  var tip = document.getElementById('tip');
  var answerEl = document.getElementById('answer');
  var nextBtn = document.getElementById('nextBtn');
  var keyboard = document.getElementById('keyboard');

  function randomTarget() {
    target = [];
    for (var i = 0; i < LENGTH; i++) {
      target.push(Math.floor(Math.random() * 10));
    }
    console.log(target);
  }

  function render() {
    for (var i = 0; i < LENGTH; i++) {
      boxes[i].textContent = input[i] === undefined ? '' : input[i];
      boxes[i].className = 'box'
        + (input[i] !== undefined ? ' filled' : '')
        + (!judged && i === input.length ? ' active' : '');
    }
  }

  function pressDigit(d) {
    if (judged || input.length >= LENGTH) return;
    if (tip.textContent) {
      tip.textContent = '';
      tip.className = '';
    }
    input.push(Number(d));
    render();
    if (input.length === LENGTH) judge();
  }

  function pressDelete() {
    if (judged || input.length === 0) return;
    input.pop();
    render();
  }

  function judge() {
    judged = true;
    var hits = 0;
    for (var i = 0; i < LENGTH; i++) {
      if (input[i] === target[i]) hits++;
    }
    render();
    if (hits === LENGTH) {
      tip.textContent = '全部正确！';
      tip.className = 'good';
      score++;
      document.getElementById('score').textContent = score;
      answerEl.textContent = '正确答案：' + target.join('');
      nextBtn.textContent = '下一题';
      nextBtn.classList.add('show');
      setKeypadEnabled(false);
    } else {
      // 猜错：自动清空，留着同一组随机数继续猜
      attempts++;
      document.getElementById('attempts').textContent = attempts;
      input = [];
      judged = false;
      tip.textContent = '对了 ' + hits + ' 个，再猜一次';
      tip.className = 'bad';
      render();
    }
  }

  function handleNext() {
    nextRound();
  }

  function nextRound() {
    round++;
    document.getElementById('round').textContent = round;
    input = [];
    judged = false;
    attempts = 1;
    document.getElementById('attempts').textContent = attempts;
    tip.textContent = '';
    tip.className = '';
    answerEl.textContent = '';
    nextBtn.classList.remove('show');
    setKeypadEnabled(true);
    randomTarget();
    render();
  }

  function setKeypadEnabled(on) {
    var btns = keyboard.querySelectorAll('button');
    for (var i = 0; i < btns.length; i++) btns[i].disabled = !on;
  }

  function buildKeypad() {
    var keys = ['1','2','3','4','5','6','7','8','9','','0','⌫'];
    keys.forEach(function (k) {
      var btn = document.createElement('button');
      if (k === '') {
        btn.style.visibility = 'hidden';
        keyboard.appendChild(btn);
        return;
      }
      if (k === '⌫') {
        btn.textContent = '⌫';
        btn.className = 'del';
        btn.onclick = pressDelete;
      } else {
        btn.textContent = k;
        btn.onclick = function () { pressDigit(k); };
      }
      keyboard.appendChild(btn);
    });
  }

  buildKeypad();
  randomTarget();
  render();
</script>
</body>
</html>
