<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>页面目录</title>
  <link rel="icon" href="/favicon.ico">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{
      min-height:100vh;
      padding:24px 16px calc(24px + env(safe-area-inset-bottom));
      background:#f5f7fa;color:#222;
      font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
    }
    h1{font-size:22px;font-weight:600;text-align:center;margin-bottom:20px}
    .list{display:flex;flex-direction:column;gap:12px;max-width:480px;margin:0 auto}
    .item{
      display:block;padding:18px 16px;border-radius:12px;
      background:#fff;color:inherit;text-decoration:none;
      box-shadow:0 2px 6px #0001;
    }
    .item:active{background:#eef4fb}
    .item .name{font-size:18px;font-weight:600}
    .item .desc{margin-top:4px;font-size:14px;color:#888}
    .item::after{content:'›';float:right;margin-top:-28px;font-size:24px;color:#bbb}
  </style>
</head>
<body>
  <h1>页面目录</h1>
  <div class="list">
    <a class="item" href="location.html">
      <div class="name">定位记录</div>
      <div class="desc">查看与记录当前位置</div>
    </a>
    <a class="item" href="mental.html">
      <div class="name">口算计时练习</div>
      <div class="desc">10 道口算题，记录用时</div>
    </a>
    <a class="item" href="MeasurementQuantity.html">
      <div class="name">数字猜猜猜</div>
      <div class="desc">4 位数字猜位置，软键盘输入</div>
    </a>
  </div>
</body>
</html>
